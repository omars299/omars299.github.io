<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Regresión Lineal</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
font-family: Arial;
text-align: center;
margin: 40px;
}

input{
width: 300px;
padding: 8px;
margin: 5px;
}

button{
padding:10px 20px;
margin-top:10px;
}

canvas{
max-width:700px;
margin:auto;
}
</style>
</head>

<body>

<h2>Calculadora de Regresión Lineal</h2>

<p>Datos de X (separados por comas)</p>
<input id="xdata" placeholder="Ej: 1,2,3,4">

<p>Datos de Y (separados por comas)</p>
<input id="ydata" placeholder="Ej: 2,3,5,7">

<br>

<button onclick="calcular()">Calcular</button>

<h3 id="resultado"></h3>

<canvas id="grafica"></canvas>

<script>

let grafica = null;

function calcular(){

let x = document.getElementById("xdata").value.split(",").map(Number);
let y = document.getElementById("ydata").value.split(",").map(Number);

let n = x.length;

let sumx = 0;
let sumy = 0;
let sumxy = 0;
let sumx2 = 0;

for(let i=0;i<n;i++){
sumx += x[i];
sumy += y[i];
sumxy += x[i]*y[i];
sumx2 += x[i]*x[i];
}

let m = (n*sumxy - sumx*sumy)/(n*sumx2 - sumx*sumx);
let b = (sumy - m*sumx)/n;

document.getElementById("resultado").innerHTML =
"y = " + m.toFixed(4) + "x + " + b.toFixed(4);

let puntos = [];

for(let i=0;i<n;i++){
puntos.push({x:x[i],y:y[i]});
}

let minx = Math.min(...x);
let maxx = Math.max(...x);

let linea = [
{x:minx, y:m*minx + b},
{x:maxx, y:m*maxx + b}
];

if(grafica){
grafica.destroy();
}

let ctx = document.getElementById("grafica").getContext("2d");

grafica = new Chart(ctx,{
type:"scatter",
data:{
datasets:[
{
label:"Datos",
data:puntos
},
{
label:"Recta de regresión",
type:"line",
data:linea,
fill:false
}
]
},
options:{
scales:{
x:{
type:"linear",
position:"bottom"
}
}
}
});

}

</script>

</body>
</html>
