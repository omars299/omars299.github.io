<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Lector PDF CFE + OCR</title>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

  <!-- Tesseract.js -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

  <style>
    body { font-family: Arial; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 10px; }
    th { background: #eee; }
    button { margin-top: 10px; padding: 8px 15px; }
  </style>
</head>
<body>

<h2>Recibo CFE - PDF con OCR</h2>

<input type="file" id="pdfInput" accept="application/pdf">

<br><br>
<button onclick="guardarDatos()">Guardar datos</button>
<button onclick="descargarCSV()">Descargar CSV</button>

<table>
  <thead>
    <tr>
      <th>Propietario</th>
      <th>No. Servicio</th>
      <th>Dirección</th>
      <th>Consumo (kWh)</th>
    </tr>
  </thead>
  <tbody>
    <tr>
      <td id="propietario"></td>
      <td id="servicio"></td>
      <td id="direccion"></td>
      <td id="consumo"></td>
    </tr>
  </tbody>
</table>

<script>
const pdfInput = document.getElementById("pdfInput");

pdfInput.addEventListener("change", async function () {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function () {

    const pdfData = new Uint8Array(this.result);
    const pdf = await pdfjsLib.getDocument(pdfData).promise;

    let textoCompleto = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      textoCompleto += content.items.map(i => i.str).join(" ");
    }

    // 📉 Si el texto es muy poco → OCR
    if (textoCompleto.length < 100) {
      textoCompleto = await ejecutarOCR(pdf);
    }

    extraerDatos(textoCompleto);
  };

  reader.readAsArrayBuffer(file);
});

// 🔎 OCR
async function ejecutarOCR(pdf) {
  let textoOCR = "";

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 2 });

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: ctx, viewport }).promise;

    const result = await Tesseract.recognize(canvas, "spa");
    textoOCR += result.data.text + " ";
  }
  return textoOCR;
}

// 📌 EXTRACCIÓN CFE
function extraerDatos(texto) {

  const propietarioRegex = /[A-ZÁÉÍÓÚÑ]{3,}(?:\s[A-ZÁÉÍÓÚÑ]{3,}){2,}/;
  const servicioRegex = /No\.?\s?de\s?Servicio[:\s]*\d{8,}/i;
  const direccionRegex = /(CALLE|AVENIDA|COLONIA|COL\.|CP)\s?.{10,60}/i;
  const consumoRegex = /\d+\s?kWh/i;

  document.getElementById("propietario").textContent =
    texto.match(propietarioRegex)?.[0] || "No encontrado";

  document.getElementById("servicio").textContent =
    texto.match(servicioRegex)?.[0] || "No encontrado";

  document.getElementById("direccion").textContent =
    texto.match(direccionRegex)?.[0] || "No encontrado";

  document.getElementById("consumo").textContent =
    texto.match(consumoRegex)?.[0] || "No encontrado";
}

// 💾 Guardar en localStorage
function guardarDatos() {
  const datos = {
    propietario: propietario.textContent,
    servicio: servicio.textContent,
    direccion: direccion.textContent,
    consumo: consumo.textContent
  };

  localStorage.setItem("reciboCFE", JSON.stringify(datos));
  alert("Datos guardados correctamente ✅");
}

// 📤 Descargar CSV
function descargarCSV() {
  const fila = [
    "Propietario,No Servicio,Dirección,Consumo",
    `${propietario.textContent},${servicio.textContent},${direccion.textContent},${consumo.textContent}`
  ].join("\n");

  const blob = new Blob([fila], { type: "text/csv" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "recibo_cfe.csv";
  link.click();
}
</script>

</body>
</html>
