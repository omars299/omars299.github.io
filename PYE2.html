<script>

let registros = [];

function normalizarTexto(texto){
return texto
.replace(/\n/g," ")
.replace(/SERVlClO/g,"SERVICIO")
.replace(/O/g,"0")
.replace(/I/g,"1")
.replace(/\s+/g," ")
.toUpperCase();
}

document.getElementById('pdfUpload').addEventListener('change', async function(e){

let file = e.target.files[0];
let reader = new FileReader();

reader.onload = async function(){

let typedarray = new Uint8Array(this.result);
let pdf = await pdfjsLib.getDocument(typedarray).promise;
let page = await pdf.getPage(1);

let viewport = page.getViewport({scale:3});
let canvas = document.createElement("canvas");
let context = canvas.getContext("2d");

canvas.height = viewport.height;
canvas.width = viewport.width;

await page.render({canvasContext:context,viewport:viewport}).promise;

Tesseract.recognize(canvas,'spa').then(({data:{text}})=>{

let limpio = normalizarTexto(text);

// 🔍 EXTRACCIÓN MEJORADA
let propietario = limpio.match(/([A-Z]+\s[A-Z]+\s[A-Z]+\s[A-Z]+)/);
let servicio = limpio.match(/NO\.?\s*DE\s*SERVICIO\s*(\d{10,12})/);
let direccion = limpio.match(/(CALLE|AV|COL|MZ|LT)[A-Z0-9\s\.\-]+/);
let consumo = limpio.match(/(\d+)\s*KWH/);
let total = limpio.match(/\$\s*(\d+\.\d+)/);

// 📦 GUARDAR EN OBJETO
let datos = {
propietario: propietario?propietario[0]:"No encontrado",
servicio: servicio?servicio[1]:"No encontrado",
direccion: direccion?direccion[0]:"No encontrado",
consumo: consumo?consumo[1]:"No encontrado",
total: total?total[1]:"No encontrado",
archivo: URL.createObjectURL(file)
};

// 💾 GUARDAR EN MEMORIA
registros.push(datos);

// 📊 ACTUALIZAR TABLA
actualizarTabla();

});

};

reader.readAsArrayBuffer(file);

});

function actualizarTabla(){

let tabla = document.getElementById("tablaDatos");
tabla.innerHTML = "";

registros.forEach(d => {

tabla.innerHTML += `
<tr>
<td>${d.propietario}</td>
<td>${d.servicio}</td>
<td>${d.direccion}</td>
<td>${d.consumo}</td>
<td>${d.total}</td>
<td><a href="${d.archivo}" download="Recibo_CFE.pdf">Descargar</a></td>
</tr>
`;

});

}

</script>
