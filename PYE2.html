<script>
const pdfInput = document.getElementById("pdfInput");

pdfInput.addEventListener("change", async function () {
  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function () {

    const pdfData = new Uint8Array(this.result);
    const pdf = await pdfjsLib.getDocument(pdfData).promise;

    let textoCompleto = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      textoCompleto += content.items.map(i => i.str).join(" ") + " ";
    }

    // OCR si el texto es muy poco
    if (textoCompleto.length < 100) {
      textoCompleto = await ejecutarOCR(pdf);
    }

    extraerDatosConFallback(textoCompleto);
  };

  reader.readAsArrayBuffer(file);
});

// 🔎 OCR
async function ejecutarOCR(pdf) {
  let textoOCR = "";

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 2 });

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: ctx, viewport }).promise;

    const result = await Tesseract.recognize(canvas, "spa");
    textoOCR += result.data.text + " ";
  }
  return textoOCR;
}

// 🧠 SISTEMA DE PATRONES CON FALLBACK
function buscarConPatrones(texto, patrones) {
  for (const patron of patrones) {
    const match = texto.match(patron);
    if (match) return match[0];
  }
  return "No encontrado";
}

// 📌 EXTRACCIÓN INTELIGENTE CFE
function extraerDatosConFallback(texto) {

  const patrones = {
    propietario: [
      /[A-ZÁÉÍÓÚÑ]{3,}(?:\s[A-ZÁÉÍÓÚÑ]{3,}){2,}/,
      /NOMBRE\s?DEL\s?USUARIO\s?:?\s?([A-Z\s]+)/i,
      /USUARIO\s?:?\s?([A-Z\s]{10,})/i
    ],

    servicio: [
      /No\.?\s?de\s?Servicio[:\s]*\d{8,}/i,
      /SERVICIO\s?\d{8,}/i,
      /\b\d{10,}\b/
    ],

    direccion: [
      /(CALLE|AVENIDA|COLONIA|COL\.|CP)\s?.{10,80}/i,
      /DOMICILIO\s?:?\s?.{15,80}/i,
      /DIRECCION\s?:?\s?.{15,80}/i
    ],

    consumo: [
      /\d+\s?kWh/i,
      /CONSUMO\s?:?\s?\d+/i,
      /\b\d{2,4}\b\s?(?=kWh)/i
    ]
  };

  document.getElementById("propietario").textContent =
    buscarConPatrones(texto, patrones.propietario);

  document.getElementById("servicio").textContent =
    buscarConPatrones(texto, patrones.servicio);

  document.getElementById("direccion").textContent =
    buscarConPatrones(texto, patrones.direccion);

  document.getElementById("consumo").textContent =
    buscarConPatrones(texto, patrones.consumo);
}
</script>
