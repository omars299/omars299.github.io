<script>

let registros = [];

function limpiarTexto(texto){
return texto
.replace(/\n+/g,"\n")
.replace(/\s+/g," ")
.replace(/SERVlClO/g,"SERVICIO")
.replace(/D1RECC1ON/g,"DIRECCION")
.toUpperCase();
}

document.getElementById('pdfUpload').addEventListener('change', async function(e){

let file = e.target.files[0];
let reader = new FileReader();

reader.onload = async function(){

let typedarray = new Uint8Array(this.result);
let pdf = await pdfjsLib.getDocument(typedarray).promise;
let page = await pdf.getPage(1);

let viewport = page.getViewport({scale:3});
let canvas = document.createElement("canvas");
let context = canvas.getContext("2d");

canvas.height = viewport.height;
canvas.width = viewport.width;

await page.render({canvasContext:context,viewport:viewport}).promise;

Tesseract.recognize(canvas,'spa').then(({data:{text}})=>{

let limpio = limpiarTexto(text);

console.log(limpio); // Para depuración

// 🔎 EXTRAER EXACTAMENTE LO QUE VA DESPUÉS

let propietarioMatch = limpio.match(/NOMBRE\s*[:\-]?\s*([A-ZÁÉÍÓÚÑ\s]+)/);
let servicioMatch = limpio.match(/NO\.?\s*DE\s*SERVICIO\s*[:\-]?\s*(\d+)/);
let direccionMatch = limpio.match(/DIRECCION\s*[:\-]?\s*([A-Z0-9\s\.\-#]+)/);
let consumoMatch = limpio.match(/(\d+)\s*KWH/);

let datos = {
propietario: propietarioMatch ? propietarioMatch[1].trim() : "No encontrado",
servicio: servicioMatch ? servicioMatch[1].trim() : "No encontrado",
direccion: direccionMatch ? direccionMatch[1].trim() : "No encontrado",
consumo: consumoMatch ? consumoMatch[1].trim() : "No encontrado",
archivo: URL.createObjectURL(file)
};

registros.push(datos);
actualizarTabla();

});

};

reader.readAsArrayBuffer(file);

});

function actualizarTabla(){

let tabla = document.getElementById("tablaDatos");
tabla.innerHTML = "";

registros.forEach(d => {

tabla.innerHTML += `
<tr>
<td>${d.propietario}</td>
<td>${d.servicio}</td>
<td>${d.direccion}</td>
<td>${d.consumo}</td>
<td><a href="${d.archivo}" download="Recibo_CFE.pdf">Descargar</a></td>
</tr>
`;

});

}

</script>
