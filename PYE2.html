<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lector Recibo CFE</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body{font-family:Arial;text-align:center}
table{margin:auto;border-collapse:collapse;width:90%}
td,th{border:1px solid black;padding:8px}
</style>
</head>

<body>

<h2>Escanear Recibo de Luz (PDF)</h2>

<input type="file" id="pdfUpload" accept="application/pdf">
<br><br>

<table>
<thead>
<tr>
<th>Propietario</th>
<th>No. Servicio</th>
<th>Dirección</th>
<th>Consumo (kWh)</th>
<th>Descargar</th>
</tr>
</thead>
<tbody id="tablaDatos"></tbody>
</table>

<script>

document.getElementById('pdfUpload').addEventListener('change', async function(e){

let file = e.target.files[0];
let reader = new FileReader();

reader.onload = async function(){

let typedarray = new Uint8Array(this.result);

let pdf = await pdfjsLib.getDocument(typedarray).promise;
let page = await pdf.getPage(1);

let viewport = page.getViewport({scale:2});
let canvas = document.createElement("canvas");
let context = canvas.getContext("2d");

canvas.height = viewport.height;
canvas.width = viewport.width;

await page.render({canvasContext:context,viewport:viewport}).promise;

Tesseract.recognize(canvas,'spa').then(({data:{text}})=>{

console.log(text);

// 🔍 LIMPIEZA DE TEXTO
let limpio = text.replace(/\n/g," ");

// 📌 EXTRACCIÓN CFE
let propietario = limpio.match(/Nombre\s*[:\-]?\s*([A-ZÁÉÍÓÚÑ\s]+)/i);
let servicio = limpio.match(/Servicio\s*[:\-]?\s*(\d{10,12})/i);
let direccion = limpio.match(/Direcci[oó]n\s*[:\-]?\s*([A-Z0-9\s\.\#\-]+)/i);
let consumo = limpio.match(/Energ[ií]a\s*Consumida\s*(\d+)\s*kWh/i);

let tabla = document.getElementById("tablaDatos");

tabla.innerHTML += `
<tr>
<td>${propietario?propietario[1]:"No encontrado"}</td>
<td>${servicio?servicio[1]:"No encontrado"}</td>
<td>${direccion?direccion[1]:"No encontrado"}</td>
<td>${consumo?consumo[1]:"No encontrado"}</td>
<td><a href="${URL.createObjectURL(file)}" download="Recibo_CFE.pdf">Descargar</a></td>
</tr>
`;

});

};

reader.readAsArrayBuffer(file);

});

</script>

</body>
</html>
