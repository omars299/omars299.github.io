<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lector de Recibos de Luz PDF</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.14.305/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@4/dist/tesseract.min.js"></script>

<style>
body{font-family:Arial;text-align:center}
table{margin:auto;border-collapse:collapse;width:80%}
td,th{border:1px solid black;padding:8px}
</style>
</head>

<body>

<h2>Escanear Recibo de Luz PDF</h2>

<input type="file" id="pdfUpload" accept="application/pdf">
<br><br>

<table>
<thead>
<tr>
<th>Nombre</th>
<th>Servicio</th>
<th>Dirección</th>
<th>Periodo</th>
<th>Consumo</th>
<th>Total</th>
<th>Descargar</th>
</tr>
</thead>
<tbody id="tablaDatos"></tbody>
</table>

<script>

document.getElementById('pdfUpload').addEventListener('change', async function(e){

let file = e.target.files[0];
let reader = new FileReader();

reader.onload = async function(){

let typedarray = new Uint8Array(this.result);

let pdf = await pdfjsLib.getDocument(typedarray).promise;
let page = await pdf.getPage(1);

let viewport = page.getViewport({scale:2});
let canvas = document.createElement("canvas");
let context = canvas.getContext("2d");

canvas.height = viewport.height;
canvas.width = viewport.width;

await page.render({canvasContext:context,viewport:viewport}).promise;

Tesseract.recognize(canvas,'spa').then(({data:{text}})=>{

console.log(text);

// Expresiones regulares (CFE)
let nombre = text.match(/Nombre\s*(.*)/);
let servicio = text.match(/Servicio\s*(\d+)/);
let direccion = text.match(/Dirección\s*(.*)/);
let periodo = text.match(/Periodo\s*(.*)/);
let consumo = text.match(/kWh\s*(\d+)/);
let total = text.match(/\$\s*(\d+\.?\d*)/);

let tabla = document.getElementById("tablaDatos");

tabla.innerHTML += `
<tr>
<td>${nombre?nombre[1]:"-"}</td>
<td>${servicio?servicio[1]:"-"}</td>
<td>${direccion?direccion[1]:"-"}</td>
<td>${periodo?periodo[1]:"-"}</td>
<td>${consumo?consumo[1]:"-"}</td>
<td>${total?total[1]:"-"}</td>
<td><a href="${URL.createObjectURL(file)}" download="Recibo.pdf">Descargar</a></td>
</tr>
`;

});

};

reader.readAsArrayBuffer(file);

});

</script>

</body>
</html>
