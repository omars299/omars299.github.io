<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Lector Recibo CFE PDF + OCR</title>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- Tesseract OCR -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
  body { font-family: Arial, sans-serif; padding: 20px; }
  table { width: 100%; border-collapse: collapse; margin-top: 20px; }
  th, td { border: 1px solid #ccc; padding: 10px; }
  th { background: #eee; }
  button { margin-top: 10px; padding: 8px 14px; }
</style>
</head>

<body>

<h2>Lector de Recibos CFE (PDF + OCR)</h2>

<input type="file" id="pdfInput" accept="application/pdf">

<br><br>
<button onclick="guardarDatos()">Guardar datos</button>
<button onclick="descargarCSV()">Descargar CSV</button>

<table>
<thead>
<tr>
  <th>Propietario</th>
  <th>No. Servicio</th>
  <th>Dirección</th>
  <th>Consumo (kWh)</th>
  <th>Total a pagar ($)</th>
</tr>
</thead>
<tbody>
<tr>
  <td id="propietario"></td>
  <td id="servicio"></td>
  <td id="direccion"></td>
  <td id="consumo"></td>
  <td id="total"></td>
</tr>
</tbody>
</table>

<script>
document.getElementById("pdfInput").addEventListener("change", async function () {

  const file = this.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function () {

    const pdfData = new Uint8Array(this.result);
    const pdf = await pdfjsLib.getDocument(pdfData).promise;

    let textoCompleto = "";

    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      textoCompleto += content.items.map(i => i.str).join(" ") + " ";
    }

    // Si el texto es insuficiente, aplicar OCR
    if (textoCompleto.length < 100) {
      textoCompleto = await ejecutarOCR(pdf);
    }

    extraerDatosConFallback(textoCompleto);
  };

  reader.readAsArrayBuffer(file);
});

// OCR para PDFs escaneados
async function ejecutarOCR(pdf) {
  let textoOCR = "";

  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const viewport = page.getViewport({ scale: 2 });

    const canvas = document.createElement("canvas");
    const ctx = canvas.getContext("2d");
    canvas.width = viewport.width;
    canvas.height = viewport.height;

    await page.render({ canvasContext: ctx, viewport }).promise;

    const result = await Tesseract.recognize(canvas, "spa");
    textoOCR += result.data.text + " ";
  }
  return textoOCR;
}

// Busca usando múltiples patrones
function buscarConPatrones(texto, patrones) {
  for (const patron of patrones) {
    const match = texto.match(patron);
    if (match) return match[0];
  }
  return "No encontrado";
}

// Extracción robusta CFE
function extraerDatosConFallback(texto) {

  const patrones = {
    propietario: [
      /[A-ZÁÉÍÓÚÑ]{3,}(?:\s[A-ZÁÉÍÓÚÑ]{3,}){2,}/,
      /NOMBRE\s?DEL\s?USUARIO\s?:?\s?([A-Z\s]+)/i,
      /USUARIO\s?:?\s?([A-Z\s]{10,})/i
    ],

    servicio: [
      /No\.?\s?de\s?Servicio[:\s]*\d{8,}/i,
      /SERVICIO\s?\d{8,}/i,
      /\b\d{10,}\b/
    ],

    direccion: [
      /(CALLE|AVENIDA|COLONIA|COL\.|CP)\s?.{10,80}/i,
      /DOMICILIO\s?:?\s?.{15,80}/i,
      /DIRECCION\s?:?\s?.{15,80}/i
    ],

    consumo: [
      /\d+\s?kWh/i,
      /CONSUMO\s?:?\s?\d+/i,
      /\b\d{2,4}\b\s?(?=kWh)/i
    ],

    total: [
      /\$\s?\d{1,3}(?:,\d{3})*(?:\.\d{2})?/,
      /TOTAL\s?A\s?PAGAR\s?\$?\s?\d+(?:\.\d{2})?/i,
      /IMPORTE\s?A\s?PAGAR\s?\$?\s?\d+(?:\.\d{2})?/i,
      /PAGAR\s?\$?\s?\d+(?:\.\d{2})?/i,
      /S\s?\d{1,4}(?:\.\d{2})?/ // error OCR común
    ]
  };

  propietario.textContent = buscarConPatrones(texto, patrones.propietario);
  servicio.textContent    = buscarConPatrones(texto, patrones.servicio);
  direccion.textContent   = buscarConPatrones(texto, patrones.direccion);
  consumo.textContent     = buscarConPatrones(texto, patrones.consumo);
  total.textContent       = buscarConPatrones(texto, patrones.total);
}

// Guardar datos
function guardarDatos() {
  const datos = {
    propietario: propietario.textContent,
    servicio: servicio.textContent,
    direccion: direccion.textContent,
    consumo: consumo.textContent,
    total: total.textContent
  };
  localStorage.setItem("reciboCFE", JSON.stringify(datos));
  alert("Datos guardados correctamente ✅");
}

// Descargar CSV
function descargarCSV() {
  const csv =
    "Propietario,No Servicio,Dirección,Consumo,Total\n" +
    `"${propietario.textContent}","${servicio.textContent}","${direccion.textContent}","${consumo.textContent}","${total.textContent}"`;

  const blob = new Blob([csv], { type: "text/csv" });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(blob);
  link.download = "recibo_cfe.csv";
  link.click();
}
</script>

</body>
</html>
